<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toko Makanan Bnuls Esport</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/lucide-static@0.321.0/font/lucide.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen">

<div id="app"></div>

<script type="module">
import React, { useState } from 'https://esm.sh/react@18';
import ReactDOM from 'https://esm.sh/react-dom@18/client';

// === DAFTAR MENU KAMU ===
const MENU = [
  { id:1, nama:"Nasi Goreng Spesial", harga:15000, gambar:"https://source.unsplash.com/featured/?nasi-goreng", kategori:"Makanan Berat" },
  { id:2, nama:"Mie Goreng Jawa", harga:13000, gambar:"https://source.unsplash.com/featured/?mie-goreng", kategori:"Makanan Berat" },
  { id:3, nama:"Ayam Bakar", harga:18000, gambar:"https://source.unsplash.com/featured/?ayam-bakar", kategori:"Makanan Berat" },
  { id:4, nama:"Es Teh Manis", harga:3000, gambar:"https://source.unsplash.com/featured/?es-teh", kategori:"Minuman" },
  { id:5, nama:"Es Jeruk", harga:4000, gambar:"https://source.unsplash.com/featured/?es-jeruk", kategori:"Minuman" },
  { id:6, nama:"Kentang Goreng", harga:8000, gambar:"https://source.unsplash.com/featured/?kentang-goreng", kategori:"Cemilan" }
];

// === UANG RUPIAH OTOMATIS ===
function formatRupiah(angka){
  return new Intl.NumberFormat('id-ID', { 
    style:'currency', 
    currency:'IDR', 
    minimumFractionDigits:0 
  }).format(angka);
}

// === TAMPILAN UTAMA ===
function App(){
  const [keranjang, setKeranjang] = useState([]);

  function tambahPesanan(menu){
    const ada = keranjang.find(benda => benda.id === menu.id);
    if(ada){
      setKeranjang(keranjang.map(benda => 
        benda.id === menu.id ? {...benda, jumlah: benda.jumlah + 1} : benda
      ));
    }else{
      setKeranjang([...keranjang, {...menu, jumlah: 1}]);
    }
  }

  const totalBayar = keranjang.reduce((jumlah, item) => jumlah + (item.harga * item.jumlah), 0);

  return (
    <div className="max-w-4xl mx-auto p-4">
      {/* HEADER TOKO */}
      <header className="bg-orange-500 text-white p-5 rounded-xl mb-6 shadow-lg">
        <h1 className="text-2xl font-bold">🍔 Toko Makanan Bnuls Esport</h1>
        <p className="opacity-90">Makan Enak, Harga Bersahabat 🚀</p>
      </header>

      <div className="grid md:grid-cols-3 gap-5">
        <!-- DAFTAR MENU -->
        <div className="md:col-span-2 space-y-4">
          <h2 className="text-xl font-bold text-slate-800">📋 Pilih Menu</h2>
          <div className="grid sm:grid-cols-2 gap-4">
            {MENU.map(item => (
              <div key={item.id} className="bg-white rounded-xl shadow overflow-hidden border border-slate-100 hover:shadow-md transition-shadow">
                <img src={item.gambar} alt={item.nama} className="w-full h-36 object-cover" />
                <div className="p-4">
                  <h3 className="font-semibold text-slate-800">{item.nama}</h3>
                  <p className="text-orange-600 font-bold mt-1">{formatRupiah(item.harga)}</p>
                  <button 
                    onClick={() => tambahPesanan(item)}
                    className="w-full mt-3 bg-orange-500 hover:bg-orange-600 text-white py-2 rounded-lg text-sm font-medium transition-colors"
                  >
                    + Tambah ke Pesanan
                  </button>
                </div>
              </div>
            ))}
          </div>
        </div>

        <!-- KERANJANG BELANJA -->
        <div className="bg-white rounded-xl shadow p-5 h-fit sticky top-4">
          <h2 className="text-lg font-bold text-slate-800 mb-4">🛒 Keranjang Pesanan</h2>
          {keranjang.length === 0 ? (
            <p className="text-slate-400 text-center py-6">Belum ada makanan yang dipilih 😊</p>
          ) : (
            <div className="space-y-3">
              {keranjang.map(item => (
                <div key={item.id} className="flex justify-between text-sm border-b pb-2">
                  <span>{item.nama} × {item.jumlah}</span>
                  <span className="font-medium">{formatRupiah(item.harga * item.jumlah)}</span>
                </div>
              ))}
              <div className="border-t pt-4 mt-2">
                <div className="flex justify-between font-bold text-lg text-orange-600">
                  <span>TOTAL BAYAR</span>
                  <span>{formatRupiah(totalBayar)}</span>
                </div>
                <button className="w-full mt-4 bg-green-500 hover:bg-green-600 text-white py-2.5 rounded-lg font-semibold transition-colors">
                  ✅ Konfirmasi Pesanan
                </button>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>

</body>
</html>
